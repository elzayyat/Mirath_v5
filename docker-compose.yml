services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: mirath
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mirath"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mirath-net

  api:
    build:
      context: .
      dockerfile: Mirath.API/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file (min 64 chars)}
      JWT_ISSUER: ${JWT_ISSUER:-mirath-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-mirath-client}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      GOLD_API_KEY: ${GOLD_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      STORAGE_PATH: /var/mirath/storage
    volumes:
      - storage:/var/mirath/storage
    ports:
      - "8080:8080"
    networks:
      - mirath-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
      VITE_STANDALONE_MODE: ${VITE_STANDALONE_MODE:-false}
    ports:
      - "3000:3000"
    networks:
      - mirath-net

networks:
  mirath-net:
    driver: bridge

volumes:
  pgdata:
  storage:
